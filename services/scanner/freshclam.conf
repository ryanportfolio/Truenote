# freshclam for the Truenote scanner service: runs as a daemon beside clamd
# and asks clamd to reload after each successful update.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Update checks per day. The daily database is published several times a
# day; the wrapper reports unhealthy once it is older than 48 hours.
Checks 6
NotifyClamd /opt/scanner/clamd.conf
LogTime yes
Foreground yes
