# clamd for the Truenote scanner service. Also read by freshclam (NotifyClamd)
# to find the socket for reload requests.
Foreground yes
# Unix socket only: nothing else on the private network can reach clamd.
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
LogVerbose no
# The wrapper rejects bodies over 20 MiB (the app's upload cap) before clamd
# sees them; this only has to be larger.
StreamMaxLength 25M
# Content past an extraction limit (MaxScanSize, MaxFiles, MaxRecursion,
# scan time; defaults kept) is reported as Heuristics.Limits.Exceeded instead
# of passing unscanned. ClamAV still cuts a single zip member larger than
# MaxFileSize to its first 100 MiB without an alert (libclamav/unzip.c).
AlertExceedsMax yes
MaxThreads 4
ReadTimeout 60
CommandReadTimeout 30
# Memory: a loaded database takes roughly 1.1 GB. A concurrent reload builds
# the new engine beside the old one (about double). With "no", scans wait
# during the reload (tens of seconds, a few times a day) and the peak stays
# near one database.
ConcurrentDatabaseReload no
