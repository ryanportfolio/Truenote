version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
  - package-ecosystem: docker
    # Dockerfile.railway and the scanner image pin their bases by digest;
    # Dependabot proposes new digests when the upstream images are rebuilt.
    directories: ["/", "/services/scanner"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Node major upgrades are planned changes to the next LTS line, not
    # Dependabot updates: odd-numbered releases never become LTS, and a
    # version list such as "25.x" did not match tags like 25-bookworm-slim
    # (Dependabot opened #266 and #267 for Node 25). Digest updates within
    # the current major still arrive. The scanner stays on the ClamAV 1.4
    # LTS line: patch releases and digest updates only.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: clamav/clamav-debian
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
