name: Scanner image

# Builds the `scanner` service image (services/scanner/Dockerfile), runs it,
# and checks the real ClamAV engine through the HTTP contract: clean files
# pass, EICAR and zips nested past the recursion limit are infected, a wrong
# token or HMAC gets 401, an oversize body is refused. A second container
# starts as root with an empty database volume, as the production service
# does, and must pass the same smoke test with clamd, freshclam and node
# running as clamav and the signatures on the volume. Also runs the wrapper's
# contract tests against a fake clamd and a Grype scan of the image: results go
# to the Security tab as SARIF and to a 90-day artifact; pull requests and
# pushes fail on a High or Critical finding that has a fix. The weekly
# scheduled run rebuilds the image, so the scanner's findings stay current
# between changes, reports only, and opens an issue when the job fails.
# Every action is pinned to a full commit SHA.
on:
  pull_request:
    paths:
      - services/scanner/**
      - .github/workflows/scanner-image.yml
      - .github/workflows/scheduled-failure-issue.yml
  push:
    branches: [main]
    paths:
      - services/scanner/**
      - .github/workflows/scanner-image.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Build and test the scanner image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Wrapper contract tests (fake clamd)
        run: node --test services/scanner/test/server.test.mjs
      - name: Build the image
        run: docker build --file services/scanner/Dockerfile --tag "truenote-scanner:${GITHUB_SHA}" .
      - name: Start the scanner
        run: |
          echo "SCANNER_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SCANNER_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run the container
        run: |
          docker run --detach --name scanner --publish 127.0.0.1:8080:8080 \
            --env SCANNER_TOKEN --env SCANNER_HMAC_KEY \
            "truenote-scanner:${GITHUB_SHA}"
      - name: EICAR and contract smoke test against ClamAV
        run: node services/scanner/test/smoke.mjs http://127.0.0.1:8080
      - name: Check the processes run as a non-root user
        run: |
          uid=$(docker exec scanner id -u)
          echo "uid ${uid}"
          test "$uid" != "0"
      - name: Record memory use
        if: always()
        run: |
          {
            echo "### Scanner container"
            echo "- Image ID: \`$(docker image inspect --format '{{.Id}}' "truenote-scanner:${GITHUB_SHA}")\`"
            echo "- Memory after the smoke test: \`$(docker stats --no-stream --format '{{.MemUsage}}' scanner)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs scanner 2>&1 | tail -n 200
      # The production service mounts a root-owned volume and starts the
      # container as root (RAILWAY_RUN_UID=0). Same here: an empty Docker
      # volume, --user 0, and SCANNER_DATABASE_DIR inside the volume.
      - name: Run the container as root with a database volume
        run: |
          docker volume create scanner-db
          docker run --detach --name scanner-root --user 0 --publish 127.0.0.1:8081:8080 \
            --volume scanner-db:/data \
            --env SCANNER_DATABASE_DIR=/data/clamav \
            --env SCANNER_TOKEN --env SCANNER_HMAC_KEY \
            "truenote-scanner:${GITHUB_SHA}"
      - name: EICAR and contract smoke test against the root-started container
        run: node services/scanner/test/smoke.mjs http://127.0.0.1:8081
      - name: Check clamd, freshclam and node in the root-started container are not uid 0
        run: |
          # Program name and the four Uid values (real, effective, saved,
          # filesystem) of every process, read from /proc because ps may be
          # absent. The name is the base name of argv[0]: Node 24 renames its
          # main thread to MainThread, so the Name line no longer says node.
          # Node processes also carry their script (node:server.mjs), because
          # Docker runs the image's HEALTHCHECK (node -e ...) as the container
          # user, root here; Railway does not run that health check.
          procs=$(docker exec scanner-root sh -c '
            for d in /proc/[0-9]*; do
              args=$(tr "\000" "\n" < "$d/cmdline" 2>/dev/null)
              name=$(printf "%s\n" "$args" | head -n 1)
              name=${name##*/}
              if [ "$name" = node ]; then
                script=$(printf "%s\n" "$args" | sed -n 2p)
                name="node:${script##*/}"
              fi
              uids=$(sed -n "s/^Uid:[[:space:]]*//p" "$d/status" 2>/dev/null)
              if [ -n "$name" ]; then echo "$name" $uids; fi
            done
            true')
          echo "$procs"
          for name in clamd freshclam node:server.mjs; do
            lines=$(printf '%s\n' "$procs" | grep -E "^${name} " || true)
            if [ -z "$lines" ]; then
              echo "no ${name} process found"
              exit 1
            fi
            if ! printf '%s\n' "$lines" | awk '{ for (i = 2; i <= NF; i++) if ($i == "0") bad = 1 } END { exit bad }'; then
              echo "${name} runs with uid 0"
              exit 1
            fi
          done
      - name: Check the signatures are on the volume and owned by clamav (uid 1000)
        run: |
          dir_uid=$(docker exec scanner-root stat -c '%u' /data/clamav)
          echo "/data/clamav uid ${dir_uid}"
          test "$dir_uid" = "1000"
          files=$(docker exec scanner-root find /data/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' -o -name '*.cud' \) -printf '%U %f\n')
          echo "$files"
          printf '%s\n' "$files" | grep -Eq ' main\.(cvd|cld)$'
          printf '%s\n' "$files" | grep -Eq ' daily\.(cvd|cld)$'
          if printf '%s\n' "$files" | grep -Evq '^1000 '; then
            echo "a signature file is not owned by uid 1000"
            exit 1
          fi
      - name: Root-started container logs
        if: failure()
        run: docker logs scanner-root 2>&1 | tail -n 200 || true
      - name: Grype report
        id: report
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: truenote-scanner:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
      - name: Upload SARIF to code scanning
        if: always() && steps.report.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.report.outputs.sarif }}
          category: /container/scanner
      - name: Retain SARIF evidence
        if: always() && steps.report.outputs.sarif != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-scanner-image-sarif
          path: ${{ steps.report.outputs.sarif }}
          retention-days: 90
      - name: Fail on fixable High or Critical findings
        if: github.event_name != 'schedule'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: truenote-scanner:${{ github.sha }}
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

  notify-failure:
    name: Report a failed scheduled run
    needs: [scanner]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure-issue.yml
