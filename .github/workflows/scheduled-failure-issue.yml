name: Scheduled failure issue

# Called by scheduled workflows when one of their jobs fails. Opens one issue
# per workflow, or comments on the open one, so a failed scheduled run reaches
# the owner instead of sitting unread in the Actions list. In a called
# workflow the github context is the caller's, so github.workflow and
# github.run_id name the failed run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  open-issue:
    name: Open or update the failure issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled run failed: ${WORKFLOW_NAME}"
          # Search by title on the server, then keep only an exact match.
          number=$(gh issue list --state open --search "\"${title}\" in:title" --limit 100 --json number,title \
            | jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty')
          body="Scheduled run ${RUN_URL} failed on $(date -u +%F). Read the failed jobs, fix the cause or record the finding, then close this issue."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
